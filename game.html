    ctx.beginPath(); ctx.arc(-r * 0.3, r * 0.3, r * 0.2, 0, 7); ctx.arc(r * 0.1, -r * 0.5, r * 0.16, 0, 7); ctx.arc(-r * 0.4, -r * 0.2, r * 0.13, 0, 7); ctx.fill();
  }
  if (e.poisonT > 0) {
    const b = performance.now() / 250 + e.id;
    ctx.fillStyle = 'rgba(106,176,76,0.85)';
    ctx.beginPath(); ctx.arc(-r * 0.5, Math.sin(b) * r * 0.4, r * 0.15, 0, 7); ctx.arc(r * 0.3, -r * 0.3 + Math.cos(b) * r * 0.2, r * 0.12, 0, 7); ctx.arc(0, r * 0.6, r * 0.1, 0, 7); ctx.fill();
  }
  if (e.frozenT > 0) {
    // ice block with a couple of glints
    ctx.fillStyle = 'rgba(170,220,255,0.55)'; ctx.strokeStyle = 'rgba(235,250,255,0.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.3; ctx.lineTo(Math.cos(a) * r * 1.15, Math.sin(a) * r * 1.25); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.6); ctx.lineTo(-r * 0.1, -r * 0.2); ctx.moveTo(r * 0.2, r * 0.3); ctx.lineTo(r * 0.45, r * 0.55); ctx.stroke();
  }
  ctx.restore();

  // health bar
  const bw = Math.max(22, r * 2.2), bh = e.boss ? 5 : 4, by = e.y - r - (e.boss ? 14 : 9);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(e.x - bw / 2 - 1, by - 1, bw + 2, bh + 2);
  const f = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = f > 0.5 ? '#2ecc71' : f > 0.25 ? '#f1c40f' : '#e74c3c';
  ctx.fillRect(e.x - bw / 2, by, bw * f, bh);
  if (e.boss) {
    ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(def.name, e.x, by - 4);
    ctx.fillStyle = '#f6c343'; ctx.fillText(def.name, e.x, by - 4);
  }
  ctx.globalAlpha = 1;
}

const TRAIL_RGB = { kid: '231,76,60', twins: '139,195,74', caramel: '185,119,14', rotten: '125,107,58', bouncer: '255,159,67' };
function drawProj(p) {
  if (p.trail && TRAIL_RGB[p.type]) {
    for (let i = 0; i < p.trail.length; i += 2) {
      const a = (i + 2) / p.trail.length;
      ctx.fillStyle = `rgba(${TRAIL_RGB[p.type]},${a * 0.35})`;
      ctx.beginPath(); ctx.arc(p.trail[i], p.trail[i + 1], 1.2 + a * 2.4, 0, 7); ctx.fill();
    }
  }
  switch (p.type) {
    case 'boomer': {
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(p.x + 4, p.y + 7, 7, 3.5, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin);
      ctx.strokeStyle = '#8e5a2b'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-8, 5); ctx.lineTo(0, -2); ctx.lineTo(8, 5); ctx.stroke();
      ctx.strokeStyle = '#d4a056'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-7, 4.5); ctx.lineTo(0, -1.5); ctx.lineTo(7, 4.5); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'basket': {
      const prog = 1 - Math.min(1, Math.hypot(p.tx - p.x, p.ty - p.y) / p.total);
      const s = 1 + 0.6 * Math.sin(Math.PI * prog);
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(p.x + 4 * s, p.y + 6 * s, 7, 4, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s); ctx.rotate(p.spin * 0.3);
      ctx.fillStyle = '#a0522d'; ctx.fillRect(-7, -6, 14, 12);
      ctx.strokeStyle = '#6b3e1e'; ctx.lineWidth = 1; ctx.strokeRect(-7, -6, 14, 12);
      ctx.restore();
      drawApple(p.x - 3 * s, p.y - 2 * s, 2.8 * s, '#e74c3c', false);
      drawApple(p.x + 3 * s, p.y - 2 * s, 2.8 * s, '#c0392b', false);
      break;
    }
    case 'sling': {
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy) || 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - dx / d * 14, p.y - dy / d * 14); ctx.stroke();
      drawApple(p.x, p.y, 3.6, '#c0392b', false);
      break;
    }
    case 'twins': drawApple(p.x, p.y, 3, '#8bc34a', false); break;
    case 'bouncer': drawApple(p.x, p.y, 3.4, '#ff9f43', false); break;
    case 'rotten':
      drawApple(p.x, p.y, 4, '#7d6b3a', false);
      ctx.fillStyle = '#4b3a1a';
      ctx.beginPath(); ctx.arc(p.x + 1.2, p.y + 1, 1.4, 0, 7); ctx.arc(p.x - 1.5, p.y + 1.8, 0.9, 0, 7); ctx.fill();
      break;
    case 'caramel':
      drawApple(p.x, p.y, 4.2, '#b9770e', false);
      ctx.strokeStyle = '#f5e6c8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.spin) * 7, p.y + Math.sin(p.spin) * 7); ctx.stroke();
      break;
    default: drawApple(p.x, p.y, 4.2);
  }
}

// Soft cloud shadows drifting over the field (built once, then just moved around).
const cloudSprite = (() => {
  const c = document.createElement('canvas'); c.width = 320; c.height = 180;
  const g = c.getContext('2d');
  for (const [x, y, r] of [[110, 95, 70], [175, 80, 80], [235, 100, 60], [150, 120, 55], [80, 110, 45]]) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(20,50,30,0.16)'); rg.addColorStop(1, 'rgba(20,50,30,0)');
    g.fillStyle = rg; g.fillRect(0, 0, c.width, c.height);
  }
  return c;
})();
function drawClouds() {
  const now = performance.now() / 1000;
  for (let i = 0; i < 3; i++) {
    const span = W + 360, x = ((now * (9 + i * 3) + i * 380) % span) - 330, y = [40, 250, 430][i] + Math.sin(now * 0.1 + i) * 20;
    ctx.drawImage(cloudSprite, x, y, 320 * (1 + i * 0.15), 180 * (1 + i * 0.15));
  }
}
// The Cider Hose's stream: a sagging, wobbling arc of juice with droplets running along it.
function drawStream(t) {
  const e = t.beamTarget;
  if (!e || !e.alive || !(t.beamT > 0)) return;
  const sx = t.x + Math.cos(t.angle) * 15 + Math.cos(t.angle + Math.PI / 2) * 6, sy = t.y + Math.sin(t.angle) * 15 + Math.sin(t.angle + Math.PI / 2) * 6;
  const now = performance.now() / 1000, mx = (sx + e.x) / 2 + Math.sin(now * 20) * 3, my = (sy + e.y) / 2 - 14;
  const w = 2.5 + (t.ramp || 1) * 1.2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(230,126,34,0.45)'; ctx.lineWidth = w + 3;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, e.x, e.y); ctx.stroke();
  ctx.strokeStyle = 'rgba(248,196,113,0.95)'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, e.x, e.y); ctx.stroke();
  ctx.fillStyle = 'rgba(255,240,200,0.9)';
  for (let i = 0; i < 4; i++) {
    const k = (now * 3 + i / 4) % 1, a = 1 - k;
    const x = a * a * sx + 2 * a * k * mx + k * k * e.x, y = a * a * sy + 2 * a * k * my + k * k * e.y;
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill();
  }
  // splash at the doctor grows with the ramp-up
  ctx.fillStyle = `rgba(245,176,65,${0.25 + 0.1 * (t.ramp || 1)})`;
  ctx.beginPath(); ctx.arc(e.x, e.y, 5 + (t.ramp || 1) * 2, 0, 7); ctx.fill();
}
function drawBee(b) {
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(2, 5, 3.5, 2, 0, 0, 7); ctx.fill();
  const flap = Math.abs(Math.sin(b.phase)) * 3 + 1;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.ellipse(-1, -flap, 2.6, 1.6, -0.4, 0, 7); ctx.ellipse(-1, flap, 2.6, 1.6, 0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 2.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2d3436'; ctx.fillRect(-1.6, -2.4, 1.3, 4.8); ctx.fillRect(1, -2.2, 1.1, 4.4);
  ctx.beginPath(); ctx.arc(4, 0, 1.4, 0, 7); ctx.fill();
  ctx.restore();
}
function drawStar(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.4 : r, a = i * Math.PI / 4; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function render() {
  ctx.fillStyle = '#2b1d14'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (state && state.shake > 0) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  if (!state) { ctx.restore(); return; }

  for (const tr of CUR.trees) drawTree(tr.x, tr.y);

  const sel = state.selected;
  if (sel && sel.type === 'orchard' && sel.paths[2]) {
    ctx.fillStyle = 'rgba(246,195,67,0.1)'; ctx.strokeStyle = 'rgba(246,195,67,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sel.x, sel.y, PEP_RADIUS, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  if (sel && sel.type !== 'orchard' && isFinite(towerStats(sel).range)) {
    const st = towerStats(sel);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sel.x, sel.y, st.range, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  if (sel) {
    ctx.strokeStyle = '#f6c343'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sel.x, sel.y, 20, 0, Math.PI * 2); ctx.stroke();
  }

  for (const p of state.traps) {
    ctx.globalAlpha = p.arm > 0 ? 0.5 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(p.x + 1.5, p.y + 2.5, 8, 6, 0, 0, 7); ctx.fill();
    drawPie(p.x, p.y, 7.5);
    ctx.globalAlpha = 1;
  }
  const towersSorted = [...state.towers].sort((a, b) => a.y - b.y);
  for (const t of towersSorted) drawTower(t);
  const enemiesSorted = [...state.enemies].sort((a, b) => (a.boss - b.boss) || (a.y - b.y));
  for (const e of enemiesSorted) drawDoctor(e);
  // hospitals are drawn over the doctors so they appear to walk out of the doors
  CUR.buildings.forEach((b, i) => drawBuilding(ctx, b, state.hospitalAwake === i));
  for (const t of state.towers) if (t.type === 'hose') drawStream(t);
  for (const p of state.projs) drawProj(p);
  for (const b of state.bees) drawBee(b);
  drawClouds();

  for (const q of state.parts) {
    const a = Math.max(0, q.life / q.max);
    if (q.color === 'tracer') {
      ctx.strokeStyle = `rgba(255,245,200,${a})`; ctx.lineWidth = q.size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x2, q.y2); ctx.stroke();
    } else if (q.color === 'ring') {
      ctx.strokeStyle = `rgba(255,220,150,${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (1 - a * 0.5), 0, Math.PI * 2); ctx.stroke();
    } else if (q.color === 'bellring') {
      ctx.strokeStyle = `rgba(246,195,67,${a})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(q.x, q.y, 12 + (q.size - 12) * (1 - a), 0, Math.PI * 2); ctx.stroke();
    } else if (q.color === 'frostring') {
      const r = 12 + (q.size - 12) * (1 - a * a);
      ctx.fillStyle = `rgba(200,235,255,${a * 0.25})`; ctx.strokeStyle = `rgba(225,245,255,${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (q.color === 'poof') {
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.9})`; ctx.lineWidth = 1 + 3 * a;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (1.15 - a * 0.75), 0, Math.PI * 2); ctx.stroke();
    } else if (q.color === 'star') {
      ctx.globalAlpha = a; ctx.fillStyle = '#ffd96a';
      drawStar(q.x, q.y, q.size, q.rot + q.life * 6);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.textAlign = 'center'; ctx.font = 'bold 13px sans-serif';
  for (const tx of state.texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, tx.life / tx.max * 1.5));
    // pop in slightly oversized, then settle
    const age = tx.max - tx.life, sc = age < 0.1 ? 0.6 + age * 7 : Math.max(1, 1.3 - (age - 0.1) * 3);
    ctx.save(); ctx.translate(tx.x, tx.y); ctx.scale(sc, sc);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(tx.txt, 0, 0);
    ctx.fillStyle = tx.color; ctx.fillText(tx.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore(); // end of screen shake

  // placement ghost
  if (state.placing && mouse.in) {
    const def = TOWERS[state.placing];
    const ok = canPlace(mouse.x, mouse.y) && state.money >= towerCost(state.placing);
    if (def.range && isFinite(def.range)) {
      ctx.fillStyle = ok ? 'rgba(255,255,255,0.12)' : 'rgba(255,60,60,0.15)';
      ctx.strokeStyle = ok ? 'rgba(255,255,255,0.7)' : 'rgba(255,80,80,0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, def.range, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 0.7;
    drawTower({ type: state.placing, x: mouse.x, y: mouse.y, angle: -Math.PI / 2, paths: [0, 0, 0], throwT: 0, alt: 0, id: 0, skin: SKIN[0] });
    ctx.globalAlpha = 1;
    if (!ok) {
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(mouse.x - 10, mouse.y - 10); ctx.lineTo(mouse.x + 10, mouse.y + 10);
      ctx.moveTo(mouse.x + 10, mouse.y - 10); ctx.lineTo(mouse.x - 10, mouse.y + 10); ctx.stroke();
    }
  }

  if (state.paused && !state.menu && !state.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
  }
}

// ======================= UI =======================
const shopEl = $('shop');
for (const k in TOWERS) {
  const d = TOWERS[k];
  const b = document.createElement('button');
  b.className = 'shopbtn'; b.dataset.type = k;
  b.style.setProperty('--kid', d.shirt);
  b.innerHTML = `<span class="txt"><span class="nm">${d.name}</span><span class="ct"><span class="price">$${d.cost}</span><span class="key">${d.key.toUpperCase()}</span></span></span>`;
  b.prepend(kidPortrait(k));
  b.addEventListener('click', () => selectPlacing(k));
  b.addEventListener('mouseenter', () => { $('shopdesc').textContent = d.desc; });
  shopEl.appendChild(b);
}

function selectPlacing(k) {
  if (!state || state.over || state.menu) return;
  state.placing = state.placing === k ? null : k;
  state.selected = null;
  if (state.placing) $('shopdesc').textContent = TOWERS[k].desc;
  refreshUI(true);
}

let lastInfoKey = '';
function refreshUI(force) {
  if (!state) return;
  $('sRound').textContent = state.round;
  $('sLives').textContent = fmtCount(state.lives);
  $('sMoney').textContent = fmtCount(Math.floor(state.money));
  const rp = $('roundpick'), sandbox = !!state.diff.sandbox;
  rp.hidden = !sandbox;
  if (sandbox) {
    $('btnJump').disabled = state.inWave || state.over || state.menu;
    if (document.activeElement !== $('inRound')) $('inRound').value = state.round + 1;
  }
  const left = state.queue.length + state.enemies.length;
  $('sub').textContent = state.inWave ? `Doctors remaining: ${left}` : (state.round === 0 ? `${CUR.map.name} (${CUR.map.level}) · ${state.diff.name}` : (state.auto && state.autoT > 0 ? 'Next round starting...' : 'Place kids, then start the next round.'));
  const bs = $('btnStart');
  bs.disabled = state.inWave || state.over || state.menu;
  bs.textContent = state.inWave ? `Round ${state.round} in progress` : `Start Round ${state.round + 1}`;
  $('btnSpeed').textContent = `${state.speed}x`;
  $('btnPause').textContent = state.paused ? '>' : 'II';
  for (const b of shopEl.children) {
    const k = b.dataset.type;
    b.disabled = state.money < towerCost(k);
    const pr = b.querySelector('.price'), txt = `$${towerCost(k)}`;
    if (pr.textContent !== txt) pr.textContent = txt;
    b.classList.toggle('sel', state.placing === k);
  }
  const info = $('info');
  const t = state.selected;
  if (!t) {
    if (lastInfoKey !== 'none') { info.innerHTML = 'Click a kid on the map to upgrade, sell, or change targeting.'; lastInfoKey = 'none'; }
  } else {
    const key = [t.id, t.paths.join(''), t.mode, [0, 1, 2].map(i => state.money >= pathCost(t, i)).join(''),
      sellValue(t), t.camo, state.money >= camoCost(t), t.pep, t.pepCamo].join('|');
    if (key !== lastInfoKey || force) {
      lastInfoKey = key;
      const def = TOWERS[t.type], st = towerStats(t);
      let stats;
      if (t.type === 'orchard') {
        stats = `<p>Income: <b>$${st.income}</b> per round</p>`;
        if (st.market) stats += `<p>Market: +${Math.round(st.market * 100)}% of round bonus</p>`;
        if (st.pep) stats += `<p>Pep Talk: nearby kids +${Math.round(st.pep * 100)}% damage${t.paths[2] >= MAX_TIER ? ', see camo' : ''}</p>`;
      }
      else {
        stats = `<p>Damage <b>${st.dmg.toFixed(1)}</b> &middot; Range <b>${isFinite(st.range) ? Math.round(st.range) : 'whole map'}</b> &middot; Every <b>${st.rate.toFixed(2)}s</b></p>`;
        if (st.crit) stats += `<p>${Math.round(st.crit * 100)}% chance of x${SNIPER_CRIT_MULT} critical hit</p>`;
        if (st.splash) stats += `<p>Splash radius ${Math.round(st.splash)}</p>`;
        if (st.slow) stats += `<p>Slows ${Math.round(st.slow * 100)}% for ${st.slowDur.toFixed(1)}s</p>`;
        if (def.pierce) stats += `<p>Ignores armor</p>`;
        if (st.bounces) stats += `<p>Bounces to ${st.bounces} more doctor${st.bounces > 1 ? 's' : ''} (-15% each)</p>`;
        if (st.poison) stats += `<p>Rot ${st.poison.toFixed(1)}/s for ${st.poisonDur.toFixed(1)}s, ignores armor</p>`;
        if (st.maxPies) stats += `<p>Up to ${st.maxPies} pies out at once &middot; pies hit camo</p>`;
        if (st.knock) stats += `<p>Shoves doctors back ${Math.round(st.knock)} (bosses ${Math.round(BOSS_KNOCK * 100)}%) &middot; hits camo</p>`;
        if (st.rampMax) stats += `<p>Ramps up to x${st.rampMax} on the same doctor &middot; ignores half armor</p>`;
        if (st.loop) stats += `<p>Boomerang hits every doctor it passes, out and back</p>`;
        if (st.maxBees) stats += `<p>Up to ${st.maxBees} bees at once &middot; bees smell camo</p>`;
        if (st.freeze) stats += `<p>Freezes ${st.freeze.toFixed(1)}s (bosses ${Math.round(BOSS_FREEZE * 100)}%) &middot; frozen take +${Math.round((BRITTLE - 1) * 100)}% damage &middot; hits camo</p>`;
        if (t.pep) stats += `<p style="color:#f6c343">Pep Talk +${Math.round(t.pep * 100)}% damage${t.pepCamo ? ', sees camo' : ''}</p>`;
      }
      const hints = PATH_HINTS[t.type] || PATH_HINTS.default;
      const pathRows = [0, 1, 2].map(i => {
        const tier = t.paths[i], lock = pathLock(t, i), cost = pathCost(t, i);
        const pips = Array.from({ length: MAX_TIER }, (_, j) => `<i class="${j < tier ? 'on' : ''} ${j >= SECOND_PATH_CAP ? 'hi' : ''}"></i>`).join('');
        let preview = '';
        if (!lock) {
          const ns = towerStats({ ...t, paths: t.paths.map((v, j) => j === i ? v + 1 : v) });
          if (t.type === 'orchard') preview = [`$${ns.income}/round`, `+${Math.round(ns.market * 100)}% bonus`, `+${Math.round(ns.pep * 100)}% dmg nearby`][i];
          else preview = [`dmg ${st.dmg.toFixed(1)} → ${ns.dmg.toFixed(1)}`, `every ${st.rate.toFixed(2)}s → ${ns.rate.toFixed(2)}s`, def.sniper ? `crit ${Math.round(st.crit * 100)}% → ${Math.round(ns.crit * 100)}%` : `range ${Math.round(st.range)} → ${Math.round(ns.range)}`][i];
          if (i === 0 && def.poison) preview = `rot ${st.poison.toFixed(1)}/s → ${ns.poison.toFixed(1)}/s`;
          if (i === 0 && def.knock) preview += `, shove ${Math.round(st.knock)} → ${Math.round(ns.knock)}`;
          if (i === 2 && def.bounces) preview += `, bounces ${st.bounces} → ${ns.bounces}`;
          if (i === 2 && def.trap) preview += `, pies ${st.maxPies} → ${ns.maxPies}`;
          if (i === 2 && def.hive) preview += `, bees ${st.maxBees} → ${ns.maxBees}`;
          if (i === 2 && def.rampMax) preview += `, ramp x${st.rampMax} → x${ns.rampMax}`;
          if (i === 0 && def.freeze) preview += `, freeze ${st.freeze.toFixed(1)}s → ${ns.freeze.toFixed(1)}s`;
        }
        const btn = lock
          ? `<button disabled>${lock}</button>`
          : `<button data-act="up" data-path="${i}" ${state.money < cost ? 'disabled' : ''}>Tier ${tier + 1} &middot; $${cost} [${PATH_KEYS[i].toUpperCase()}]</button>`;
        return `<div class="path p${i}"><div class="phead"><b>${PATH_NAMES[t.type][i]}</b><span class="pips">${pips}</span></div>` +
          `<div class="phint">${hints[i]}${preview ? ` &middot; <span class="prev">${preview}</span>` : ''}</div>${btn}</div>`;
      }).join('');
      const modes = isArea(def) ? '' :
        `<div class="row">${['first', 'last', 'strong', 'close'].map(m => `<button class="mode ${t.mode === m ? 'on' : ''}" data-act="mode" data-mode="${m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div>`;
      info.innerHTML = `<h3>${def.name}<span>${t.paths.join('-')}</span></h3>${stats}` +
        (t.type === 'orchard' ? '' : `<p>Knockouts: <b id="kills">${t.kills}</b></p>`) +
        pathRows +
        (state.diff.noSell ? `<div class="row"><button disabled>No selling in Surgery</button></div>`
          : `<div class="row"><button data-act="sell">Sell $${sellValue(t)} [S]</button></div>`) +
        (isArea(def) ? '' : `<div class="row">${t.camo ? '<p style="color:#81ecec;margin:0">Camo Goggles: can see War Medics</p>'
          : `<button data-act="camo" ${state.money < camoCost(t) ? 'disabled' : ''}>Camo Goggles $${camoCost(t)} [G]</button>`}</div>`) + modes;
    }
    const k = document.getElementById('kills');
    if (k) k.textContent = t.kills;
  }
}

$('info').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || !state || !state.selected) return;
  const t = state.selected;
  if (b.dataset.act === 'up') upgradeTower(t, +b.dataset.path);
  else if (b.dataset.act === 'sell') sellTower(t);
  else if (b.dataset.act === 'camo') buyCamo(t);
  else if (b.dataset.act === 'mode') { t.mode = b.dataset.mode; saveGame(); refreshUI(true); }
});

function refreshLegend() {
  const el = $('legend');
  if (!state) { el.innerHTML = ''; return; }
  const keys = Object.keys(ENEMIES).filter(k => state.seen.has(k)).sort((a, b) => ENEMIES[a].intro - ENEMIES[b].intro);
  let html = keys.map(k => {
    const e = ENEMIES[k];
    return `<div class="lg" title="${e.desc}"><span class="dot" style="background:${e.coat};border-color:${e.scrub}"></span>${e.name}<small>R${e.intro}${e.bossOnly ? ' boss' : ''}</small></div>`;
  }).join('');
  const upcoming = Object.keys(ENEMIES).filter(k => !state.seen.has(k)).sort((a, b) => ENEMIES[a].intro - ENEMIES[b].intro)[0];
  if (upcoming) html += `<div class="next">Next arrival: ${ENEMIES[upcoming].name} (round ${ENEMIES[upcoming].intro})</div>`;
  if (!keys.length && !upcoming) html = '';
  el.innerHTML = html;
}

function showOverlay(kind) {
  const best = getBest();
  let html = '';
  if (kind === 'menu') {
    const sel = MAPS.find(m => m.id === menuMap) || MAPS[2];
    const mapBtns = MAPS.map(m => `<button class="mapbtn ${m.id === sel.id ? 'sel' : ''}" data-map="${m.id}">
        <canvas data-thumb="${m.id}" width="200" height="150"></canvas>
        <span class="mname">${m.name}</span>
        <span class="mlevel" style="background:${LEVEL_COLORS[m.level]}">${m.level} &middot; ${m.paths.length} path${m.paths.length > 1 ? 's' : ''}</span>
      </button>`).join('');
    const diffBtns = Object.entries(DIFFS).map(([k, d]) => {
      const b = best[`${sel.id}:${k}`];
      return `<button data-diff="${k}"><b>${d.name}</b><span>${d.desc}<br>${fmtCount(d.lives)} ${d.lives === 1 ? 'life' : 'lives'} &middot; $${fmtCount(d.money)}${d.sandbox ? ' &middot; any round' : ''}${d.costMult ? ` &middot; ${d.costMult}x prices` : ''}${b ? `<br>Best: round ${b}` : ''}</span></button>`;
    }).join('');
    const save = loadSave();
    let resume = '';
    if (menuFromGame) {
      resume = `<div class="resume"><button class="bigbtn" data-act="continue">Back to game</button>
        ${save ? `<small>Last save: ${describeSave(save)}. Starting a new game replaces it once you place a kid.</small>` : ''}</div>`;
    } else if (save) {
      resume = `<div class="resume"><button class="bigbtn" data-act="load">Continue</button>
        <small>${describeSave(save)}. Starting a new game replaces this save once you place a kid.</small></div>`;
    }
    html = `<div class="card wide"><h2>Apple Attack</h2>
      <p>The doctors are marching out of the hospital toward the orchard. Keep them away with a well-aimed apple a day!</p>
      ${resume}
      <h3 class="mh">${resume ? 'Or start a new game: ' : ''}1. Pick a map</h3>
      <div class="maps">${mapBtns}</div>
      <p class="mdesc"><b>${sel.name}:</b> ${sel.desc}</p>
      <h3 class="mh">2. Pick a difficulty to start</h3>
      <div class="diffs">${diffBtns}</div>
      <ul>
        <li>Buy kids (1-9, 0, Q-R), click grass to place them. Click a kid to upgrade it (Z/X/C), sell (S) or change targeting.</li>
        <li>Each kid has 3 upgrade paths (damage, speed, range) with 5 tiers. Pick two paths: one can go to tier 5, the other only to tier 2.</li>
        <li>Space starts the next round. F changes speed, P pauses.</li>
        <li>The game saves itself between rounds. Use Continue here to pick up where you left off.</li>
        <li>New doctors arrive at rounds 1, 5, 10, 15, 20 (boss), 25, 30, 35, 40, 50, 60 and 80. At round ${WIN_ROUND} the Hospital itself attacks. Beat it to win!</li>
        <li>Armor shrinks each hit. The Slingshot Sniper ignores armor and can hit doctors anywhere on the map.</li>
        <li>War Medics (round 35) are camouflaged. Only kids with Camo Goggles (G) can target them.</li>
      </ul></div>`;
  } else if (kind === 'over') {
    html = `<div class="card"><h2>The doctors got in!</h2>
      <p>They reached the orchard on round <b>${state.round}</b> (${CUR.map.name}, ${state.diff.name}).<br>Best here: round ${Math.max(best[`${state.mapId}:${state.diffKey}`] || 0, state.round - 1)}.</p>
      <button class="bigbtn" data-act="retry">Try again</button><button class="bigbtn" data-act="menu">Change map / difficulty</button></div>`;
  } else if (kind === 'win') {
    html = `<div class="card"><h2>Orchard saved!</h2>
      <p>You knocked down the Hospital itself and held off every doctor through round ${WIN_ROUND} on ${state.diff.name}. Keep going in endless mode, or start over.</p>
      <button class="bigbtn" data-act="continue">Keep playing</button><button class="bigbtn" data-act="menu">Main menu</button></div>`;
  }
  overlay.innerHTML = html;
  for (const c of overlay.querySelectorAll('canvas[data-thumb]')) c.getContext('2d').drawImage(mapThumb(c.dataset.thumb), 0, 0, c.width, c.height);
  overlay.classList.remove('hidden');
  if (state) state.menu = true;
}
function hideOverlay() { overlay.classList.add('hidden'); menuFromGame = false; if (state) state.menu = false; }
function openGameMenu() {
  if (!state || state.over || state.menu) return;
  menuFromGame = true;
  showOverlay('menu');
}

overlay.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.map) {
    menuMap = b.dataset.map;
    try { localStorage.setItem('appleAttackMap', menuMap); } catch (e) { /* storage unavailable */ }
    showOverlay('menu');
  }
  else if (b.dataset.act === 'load') {
    const d = loadSave();
    if (d) { restoreGame(d); hideOverlay(); showBanner(`<div class="big">Welcome back!</div><div>Round ${state.round + 1} is ready when you are.</div>`, 2.5); }
  }
  else if (b.dataset.diff) { newGame(b.dataset.diff, menuMap); hideOverlay(); showBanner('<div class="big">Place some kids!</div><div>Then press Start Round (Space).</div>', 3); refreshUI(true); }
  else if (b.dataset.act === 'retry') { newGame(state.diffKey, state.mapId); hideOverlay(); refreshUI(true); }
  else if (b.dataset.act === 'menu') { menuFromGame = !state.over; showOverlay('menu'); }
  else if (b.dataset.act === 'continue') { hideOverlay(); refreshUI(true); }
});

$('btnStart').addEventListener('click', startWave);
$('btnSpeed').addEventListener('click', cycleSpeed);
$('btnPause').addEventListener('click', togglePause);
$('btnSave').addEventListener('click', manualSave);
$('btnMenu').addEventListener('click', openGameMenu);
$('btnJump').addEventListener('click', jumpToRound);
$('inRound').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); jumpToRound(); } });
// Super Easy only: start any round straight away.
function jumpToRound() {
  if (!state || !state.diff.sandbox || state.inWave || state.over || state.menu) return;
  const r = Math.round(Number($('inRound').value));
  if (!Number.isFinite(r) || r < 1 || r > 999) { showBanner('<div class="big">Pick a round from 1 to 999</div>', 1.6); return; }
  $('inRound').blur();
  state.round = r - 1;
  startWave();
}
$('chkAuto').addEventListener('change', ev => {
  if (!state) return;
  state.auto = ev.target.checked;
  if (state.auto && !state.inWave && state.round > 0) state.autoT = 1;
});
function cycleSpeed() { if (!state) return; state.speed = state.speed >= 3 ? 1 : state.speed + 1; refreshUI(true); }
function togglePause() { if (!state || state.menu || state.over) return; state.paused = !state.paused; refreshUI(true); }

// ======================= INPUT =======================
function canvasPos(ev) {
  const rect = canvas.getBoundingClientRect();
  return { x: (ev.clientX - rect.left) * W / rect.width, y: (ev.clientY - rect.top) * H / rect.height };
}
canvas.addEventListener('pointermove', ev => { const p = canvasPos(ev); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
canvas.addEventListener('pointerleave', () => { mouse.in = false; });
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); if (state) { state.placing = null; refreshUI(true); } });
canvas.addEventListener('pointerdown', ev => {
  if (!state || state.menu || state.over || ev.button === 2) return;
  const p = canvasPos(ev);
  mouse.x = p.x; mouse.y = p.y; mouse.in = true;
  if (state.placing) {
    const t = placeTower(state.placing, p.x, p.y);
    if (t) {
      if (!ev.shiftKey || state.money < towerCost(state.placing)) state.placing = null;
    }
    refreshUI(true);
    return;
  }
  let hit = null;
  for (const t of state.towers) if (Math.hypot(t.x - p.x, t.y - p.y) < 18) hit = t;
  state.selected = hit;
  refreshUI(true);
});

window.addEventListener('keydown', ev => {
  if (!state || ev.target.tagName === 'INPUT') return;
  const k = ev.key.toLowerCase();
  if (k === ' ') { ev.preventDefault(); startWave(); return; }
  if (k === 'escape') { state.placing = null; state.selected = null; refreshUI(true); return; }
  if (k === 'p') { togglePause(); return; }
  if (k === 'f') { cycleSpeed(); return; }
  if (k === 's' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); manualSave(); return; }
  if (state.menu || state.over) return;
  const pi = PATH_KEYS.indexOf(k);
  if (pi >= 0 && state.selected) { upgradeTower(state.selected, pi); return; }
  if (k === 's' && state.selected) { sellTower(state.selected); return; }
  if (k === 'g' && state.selected) { buyCamo(state.selected); return; }
  if (k === 'm') { openGameMenu(); return; }
  for (const tk in TOWERS) if (TOWERS[tk].key === k) { selectPlacing(tk); return; }
});

// ======================= LOOP =======================
let last = performance.now(), uiTimer = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state && !state.paused && !state.over && !state.menu) {
    let sim = dt * state.speed;
    while (sim > 1e-6 && !state.over) {
      const s = Math.min(sim, 1 / 60);
      update(s);
      sim -= s;
    }
  }
  render();
  uiTimer += dt;
  if (uiTimer > 0.1) { uiTimer = 0; refreshUI(false); }
  requestAnimationFrame(frame);
}

newGame('normal');
showOverlay('menu');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
